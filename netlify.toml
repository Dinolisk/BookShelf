# Netlify build config for the Angular frontend (monorepo: app lives in /frontend).

[build]
  base = "frontend"
  command = "npm run build"
  # publish is resolved from the repo root even when base is set:
  publish = "frontend/dist/bookquotes-web/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every route serves index.html so Angular's router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
