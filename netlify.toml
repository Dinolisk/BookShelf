# Netlify build config for the Angular frontend (monorepo: app lives in /frontend).
# base = where to run the build; command + publish are resolved relative to base.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/bookquotes-web/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every route serves index.html so Angular's router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
