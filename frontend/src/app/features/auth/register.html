<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <h1 class="h3 mb-4"><i class="fa-solid fa-user-plus me-2"></i>Skapa konto</h1>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Användarnamn</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        <div class="invalid-feedback">Användarnamn krävs (3–50 tecken).</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Lösenord</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="invalid-feedback">Lösenordet måste vara minst 6 tecken.</div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">Bekräfta lösenord</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [class.is-invalid]="
            form.controls.confirmPassword.touched &&
            (form.controls.confirmPassword.invalid || form.hasError('mismatch'))
          "
        />
        <div class="invalid-feedback">
          @if (form.controls.confirmPassword.hasError('required')) {
            Bekräfta lösenordet.
          } @else {
            Lösenorden matchar inte.
          }
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Skapa konto
      </button>
    </form>

    <p class="mt-3 mb-0 text-center">
      Har du redan ett konto? <a routerLink="/login">Logga in</a>
    </p>
  </div>
</div>
