<div class="auth-wrap">
  <div class="bq-card bg-body p-4 p-md-5 w-100" style="max-width: 25rem">
    <div class="text-center mb-4">
      <span class="empty-state__icon mb-2"><i class="fa-solid fa-user-plus"></i></span>
      <h1 class="h4 mb-1">Skapa konto</h1>
      <p class="text-body-secondary mb-0">Kom igång på under en minut</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-medium">Användarnamn</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        <div class="invalid-feedback">Användarnamn krävs (3–50 tecken).</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-medium">Lösenord</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="invalid-feedback">Lösenordet måste vara minst 6 tecken.</div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label fw-medium">Bekräfta lösenord</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [class.is-invalid]="
            form.controls.confirmPassword.touched &&
            (form.controls.confirmPassword.invalid || form.hasError('mismatch'))
          "
        />
        <div class="invalid-feedback">
          @if (form.controls.confirmPassword.hasError('required')) {
            Bekräfta lösenordet.
          } @else {
            Lösenorden matchar inte.
          }
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Skapa konto
      </button>
    </form>

    <p class="mt-4 mb-0 text-center text-body-secondary">
      Har du redan ett konto? <a routerLink="/login">Logga in</a>
    </p>
  </div>
</div>
