<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <h1 class="h3 mb-4"><i class="fa-solid fa-right-to-bracket me-2"></i>Logga in</h1>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Användarnamn</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          autocomplete="username"
          [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
        />
        <div class="invalid-feedback">Ange användarnamn.</div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Lösenord</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="invalid-feedback">Ange lösenord.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Logga in
      </button>
    </form>

    <p class="mt-3 mb-0 text-center">
      Ny här? <a routerLink="/register">Skapa konto</a>
    </p>
  </div>
</div>
