<div class="auth-split">
  <aside class="auth-split__brand">
    <div class="h2 fw-bold mb-2">
      <i class="fa-solid fa-book-open-reader me-2"></i>Bookshelf
    </div>
    <p class="fs-5 mb-0 opacity-75">
      Samla böckerna du läst och citaten du vill minnas – på ett ställe.
    </p>
    <ul class="list-unstyled mt-3 mb-0 opacity-75 small">
      <li class="mb-2"><i class="fa-solid fa-check me-2"></i>Hantera din boklista</li>
      <li class="mb-2"><i class="fa-solid fa-check me-2"></i>Spara favoritcitat</li>
      <li><i class="fa-solid fa-check me-2"></i>Ljust och mörkt tema</li>
    </ul>
  </aside>

  <div class="auth-split__form">
    <div class="mx-auto w-100" style="max-width: 22rem">
      <h1 class="h4 mb-1">Logga in</h1>
      <p class="text-body-secondary mb-4">Välkommen tillbaka</p>

      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-medium">Användarnamn</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">Ange användarnamn.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-medium">Lösenord</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Ange lösenord.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
          @if (submitting()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          Logga in
        </button>
      </form>

      <p class="mt-4 mb-0 text-center text-body-secondary">
        Ny här? <a routerLink="/register">Skapa konto</a>
      </p>
    </div>
  </div>
</div>
