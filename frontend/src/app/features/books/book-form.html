<a routerLink="/books" class="btn btn-link px-0 mb-3">
  <i class="fa-solid fa-arrow-left me-1"></i>Tillbaka
</a>

<h1 class="h3 mb-4">{{ isEdit ? 'Redigera bok' : 'Ny bok' }}</h1>

@if (loading()) {
  <div class="text-body-secondary">
    <span class="spinner-border spinner-border-sm me-2"></span>Laddar…
  </div>
} @else {
  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="col-md-8 col-lg-6" novalidate>
    <div class="mb-3">
      <label for="title" class="form-label">Titel</label>
      <input
        id="title"
        type="text"
        class="form-control"
        formControlName="title"
        [class.is-invalid]="form.controls.title.touched && form.controls.title.invalid"
      />
      <div class="invalid-feedback">Titel krävs (max 200 tecken).</div>
    </div>

    <div class="mb-3">
      <label for="author" class="form-label">Författare</label>
      <input
        id="author"
        type="text"
        class="form-control"
        formControlName="author"
        [class.is-invalid]="form.controls.author.touched && form.controls.author.invalid"
      />
      <div class="invalid-feedback">Författare krävs (max 200 tecken).</div>
    </div>

    <div class="mb-4">
      <label for="publishedDate" class="form-label">Publiceringsdatum</label>
      <input
        id="publishedDate"
        type="date"
        class="form-control"
        formControlName="publishedDate"
        [class.is-invalid]="form.controls.publishedDate.touched && form.controls.publishedDate.invalid"
      />
      <div class="invalid-feedback">Publiceringsdatum krävs.</div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        } @else {
          <i class="fa-solid fa-floppy-disk me-1"></i>
        }
        Spara
      </button>
      <a routerLink="/books" class="btn btn-outline-secondary">Avbryt</a>
    </div>
  </form>
}
