# Netlify build config for the Angular frontend.
# In the Netlify UI set "Base directory" to: frontend
# (publish path below is then relative to that base)

[build]
  command = "npm run build"
  publish = "dist/bookquotes-web/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every route serves index.html so Angular's router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
